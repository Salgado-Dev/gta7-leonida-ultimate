function drive(c,dt){const t=c.ty,fx=Math.cos(c.a),fy=Math.sin(c.a);let vf=c.vx*fx+c.vy*fy,vl=-c.vx*fy+c.vy*fx;const th=(K.KeyW?1:0)-(K.KeyS?1:0),st=(K.KeyD?1:0)-(K.KeyA?1:0);

for(const o of cars){if(o==c||!(o.ai=='t'||o==P.car||o.ai=='cop'))continue;const rx=o.x-c.x,ry=o.y-c.y,f=rx*dx+ry*dy;if(f>0&&f<95&&Math.abs(rx*dy-ry*dx)<24){tg=0;break}}
if(tg)for(const p of peds){if(p.dead)continue;const rx=p.x-c.x,ry=p.y-c.y,f=rx*dx+ry*dy;if(f>0&&f<70&&Math.abs(rx*dy-ry*dx)<18){tg=0;break}}
c.v+=(tg-c.v)*Math.min(1,dt*(tg<c.v?5:1.3));c.x+=dx*c.v*dt;c.y+=dy*c.v*dt;

if(d%2==0)c.y+=((j*CELL+(d?20:50))-c.y)*Math.min(1,dt*3);else c.x+=((i*CELL+(d==1?50:20))-c.x)*Math.min(1,dt*3);
if(lx<RD&&ly<RD){if(!c.tn&&(c.x-(i*CELL+40))*dx+(c.y-(j*CELL+40))*dy>=0){c.tn=1;const op=[d,(d+1)%4,(d+3)%4].filter(n=>{const a=i+DX[n],b=j+DY[n];return a>=0&&a<8&&b>=0&&b<8});c.d=R()<.35&&op.length>1?op[1+(R()*(op.length-1)|0)]:(op[0]==d?d:op[R()*op.length|0])}}else c.tn=0;
